<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chess-Game</title>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;700&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="chess.css">
</head>
<body>
    <div class="chess-game">

        <h1>♜ CHESS · AI BATTLE</h1>

        <div class="game-layout">

            <div class="board-section">

                <div class="player-tag" id="comp-tag">

                    <span class="status-dot"></span>

                    <span>⚔️ COMPUTER (Black)</span>
                </div>

                <div class="board-wrapper">

                    <div class="rank-annotations" id="rank-annotations"></div>

                    <div class="board-container">

                        <div id="chessboard"></div>
                        <div class="file-annotations" id="file-annotations"></div>
                    </div>
                </div>

                <div class="player-tag active" id="player-tag" >

                    <span class="status-dot"></span>
                    <span>🧙 YOU (White)</span>

                </div>

            </div>

            <div class="info-panel">
                <div class="panel-card">
                    <h3>📡 STATUS</h3>
                    <div class="game-status" id="game-status">Your turn — White</div>
                </div>

                <div class="panel-card">
                    <h3>🎯 DIFFICULTY</h3>
                    <div class="difficulty-group">
                        <button class="diff-option" data-diff="1">Easy</button>
                        <button class="diff-option active" data-diff="2">Medium</button>

                        <button class="diff-option" data-diff="3">Hard</button>
                    </div>
                </div>

                <div class="panel-card">
                    <h3>⚔️ CAPTURED</h3>
                    <div class="capture-stack">
                        <div class="capture-row">
                            <span class="cap-label">White</span>
                            <span id="white-captures"></span>
                        </div>

                        <div class="capture-row">
                            <span class="cap-label">Black</span>
                            <span id="black-captures"></span>
                        </div>
                    </div>
                </div>

                    <div class="panel-card">
                        <h3>📜 MOVE LOG</h3>
                        <div id="move-log-container"></div>
                    </div>

                    <button id="reset-game" class="new-game-btn">⟳ NEW GAME</button>
                </div>
            </div>

            <div id="promotionOverlay" class="promo-over-lay">
                <div class="promo-card">
                    <p>♟️ PROMOTE PAWN</p>
                    <div class="promo-choices" id="promoChoices"></div>

                </div>
            </div>
    </div>

    <script src="chess.js"></script>
</body>
</html>
